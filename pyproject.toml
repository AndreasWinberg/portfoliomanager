[project]
name = "portfoliomanager"
version = "0.1.0"
description = "Price indifferent value investing portfolio manager"
readme = "README.md"
authors = [
    { name = "AndreasWinberg", email = "andreaswinberg23@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
portfoliomanager = "portfoliomanager:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
