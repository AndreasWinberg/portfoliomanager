name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        env:
            POSTGRES_DB: db
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v10.2.0
            - run: uv sync --locked
            - run: uv run pre-commit run --all-files

            - run: docker compose up -d --wait
            - run: uv run pytest
